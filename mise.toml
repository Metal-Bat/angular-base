[tools]
pnpm = "12.11.2"
node = "24.21.0"
rtk = "0.47.0"
"pipx:graphifyy" = "0.9.53"

[settings]
activate_aggressive = true

[tasks.install]
description = "Install the exact dependency tree"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start Angular on localhost:4200 and its session boundary on localhost:3000 (backend:8000)"
run = "pnpm start"

[tasks.build]
run = "pnpm run build"

[tasks.lint]
run = "pnpm run lint"

[tasks.test]
run = "pnpm run test:ci"

[tasks.check]
description = "Verify source, types, lint, tests, build and deterministic browser quality with diagnostic evidence"
run = "node scripts/check-project.mjs"

[tasks.session]
description = "Start the same-origin session boundary on loopback:3000"
run = "pnpm run session:dev"

[tasks.browser-sandbox]
description = "Run disposable browser fixtures with failure diagnostics and screenshots"
run = "pnpm run test:browser-sandbox"
