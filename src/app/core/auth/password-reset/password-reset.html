<header class="console-page-header">
  <h1 tabindex="-1">{{ "Reset password" | localize }}</h1>
</header>
<p>
  {{
    "Forgot your password? Contact your administrator for reset assistance."
      | localize
  }}
</p>
@if (error()) {
  <p role="alert">{{ error() | localize }}</p>
}
@if (done()) {
  <p role="status">
    {{ "Password reset. Sign in with your new password." | localize }}
  </p>
}
<form (ngSubmit)="submit()">
  <label for="recovery-token">{{ "Reset token" | localize }}</label
  ><input
    autocomplete="off"
    id="recovery-token"
    maxlength="512"
    name="resetToken"
    required
    type="password"
    [ngModel]="token()"
    (ngModelChange)="token.set($event)"
  />
  <label for="recovery-password">{{ "New password" | localize }}</label
  ><input
    autocomplete="new-password"
    id="recovery-password"
    maxlength="128"
    minlength="8"
    name="newPassword"
    required
    type="password"
    [ngModel]="password()"
    (ngModelChange)="password.set($event)"
  />
  <button pButton type="submit" [disabled]="busy()">
    {{ "Reset password" | localize }}
  </button>
</form>
<a routerLink="/login">{{ "Sign in" | localize }}</a>
