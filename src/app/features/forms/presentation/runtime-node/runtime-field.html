@let vm = view();
<app-field-wrapper
  #field
  [compact]="vm.node().renderer === 'compact'"
  [errors]="vm.errors()"
  [hint]="vm.description()"
  [instance]="vm.instance()"
  [label]="vm.accessibleLabel()"
  [pointer]="vm.pointer()"
  [required]="required()"
>
  @if (!vm.writable()) {
    <output tabindex="0" [id]="field.id()"
      ><app-form-value
        [kinds]="kinds()"
        [labels]="labels()"
        [scope]="vm.node().scope ?? ''"
        [value]="vm.value()"
    /></output>
  } @else if (vm.choice()) {
    <app-choice-control
      [controlId]="field.id()"
      [data]="vm.data()"
      [describedBy]="field.describedBy()"
      [document]="vm.document()"
      [indices]="vm.indices()"
      [invalid]="vm.errors().length > 0"
      [node]="vm.node()"
      [path]="vm.path()"
      [required]="required()"
      (edit)="vm.edit.emit($event)"
    />
  } @else if (vm.node().component === "boolean") {
    <app-select-control
      [describedBy]="field.describedBy()"
      [inputId]="field.id()"
      [invalid]="vm.errors().length > 0"
      [required]="required()"
      [value]="vm.text()"
      (selectionChanged)="vm.bool($any($event.target).value)"
    >
      <option value="">{{ "Not provided" | localize }}</option>
      <option value="true">{{ "Yes" | localize }}</option>
      <option value="false">{{ "No" | localize }}</option>
    </app-select-control>
  } @else if (vm.node().component === "textarea") {
    <textarea
      [attr.aria-describedby]="field.describedBy()"
      [attr.aria-invalid]="vm.errors().length > 0"
      [attr.aria-required]="required()"
      [id]="field.id()"
      [placeholder]="placeholder()"
      [rows]="rows()"
      [value]="vm.text()"
      (input)="vm.inputValue($any($event.target).value)"
    ></textarea>
  } @else if (
    vm.node().component === "date" || vm.node().component === "datetime"
  ) {
    <app-temporal-control
      [ariaLabel]="vm.accessibleLabel()"
      [controlId]="field.id()"
      [describedBy]="field.describedBy()"
      [invalid]="vm.errors().length > 0"
      [kind]="vm.node().component"
      [required]="required()"
      [value]="vm.text()"
      (valueChange)="vm.inputValue($event)"
    />
  } @else {
    <input
      pInputText
      [attr.aria-describedby]="field.describedBy()"
      [attr.aria-invalid]="vm.errors().length > 0"
      [attr.aria-required]="required()"
      [attr.inputmode]="
        vm.node().component === 'integer'
          ? 'numeric'
          : vm.node().component === 'number'
            ? 'decimal'
            : null
      "
      [id]="field.id()"
      [placeholder]="placeholder()"
      [value]="vm.text()"
      (input)="vm.inputValue($any($event.target).value)"
    />
  }
  @if (actions().length) {
    <div class="field-actions">
      <button
        aria-haspopup="menu"
        pButton
        severity="secondary"
        type="button"
        [attr.aria-expanded]="fieldMenu.visible"
        [attr.aria-label]="('Actions' | localize) + ': ' + vm.accessibleLabel()"
        [text]="true"
        (click)="fieldMenu.toggle($event)"
      >
        <i aria-hidden="true" class="pi pi-ellipsis-h"></i>
      </button>
      <p-menu #fieldMenu appendTo="body" [model]="actions()" [popup]="true" />
    </div>
  }
</app-field-wrapper>
