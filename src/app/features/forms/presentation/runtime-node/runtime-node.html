@if (state()["visible"] !== false) {
  @if (collection()) {
    <ng-template
      #collectionChild
      let-child
      let-childIndex="childIndex"
      let-index="index"
    >
      <app-runtime-node
        [busy]="busy()"
        [data]="data()"
        [document]="document()"
        [indices]="childIndices(index)"
        [issues]="issues()"
        [node]="child"
        [path]="path() + '/children/' + childIndex"
        [renderRoot]="renderRoot()"
        (edit)="edit.emit($event)"
      />
    </ng-template>
    <app-runtime-collection [childTemplate]="collectionChild" [view]="this" />
  } @else if (attachmentsControl()) {
    <app-attachment-control
      [busy]="busy()"
      [document]="document()"
      [instance]="instance()"
      [node]="node()"
      [path]="pointer()"
      [rows]="attachmentRows()"
      [writable]="canWrite()"
    />
  } @else if (layout()) {
    <section
      class="runtime-layout"
      [attr.aria-label]="accessibleLabel()"
      [class.compact-layout]="node().renderer === 'compact'"
      [style.--form-layout-columns]="columns()"
    >
      @for (child of node().children; track $index) {
        <app-runtime-node
          [busy]="busy()"
          [data]="data()"
          [document]="document()"
          [indices]="indices()"
          [issues]="issues()"
          [node]="child"
          [path]="path() + '/children/' + $index"
          [renderRoot]="renderRoot()"
          [style.--form-grid-column]="placement(child).column"
          [style.--form-grid-row]="placement(child).row"
          (edit)="edit.emit($event)"
        />
      }
    </section>
  } @else if (node().component === "display") {
    <p>{{ node().label }}</p>
  } @else if (fieldControl()) {
    <app-runtime-field [view]="this" />
  }
}
