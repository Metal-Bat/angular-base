@let vm = view();
@let command = vm.selected()!;
<form (ngSubmit)="vm.execute()">
  @for (location of vm.locations; track location) {
    @if (command.fields[location].length) {
      <fieldset [disabled]="vm.busy()">
        <legend>{{ vm.locationLabels[location] | localize }}</legend>
        @for (field of command.fields[location]; track field.key) {
          <app-schema-input
            [controlId]="location + '-' + field.key"
            [disabled]="vm.busy()"
            [errors]="errors()"
            [label]="field.title"
            [path]="location + '.' + field.key"
            [referenceLabels]="labels()"
            [required]="field.required"
            [schema]="field.schema"
            [value]="vm.input()[location][field.key]"
            (referenceRequested)="references.open($event)"
            (valueChange)="vm.changeTyped(field, location, $event)"
          />
        }
      </fieldset>
    }
  }
  <button
    pButton
    type="submit"
    [disabled]="vm.busy() || vm.invalid().length > 0"
  >
    {{ (command.mutation ? "Review command" : "Load") | localize }}
  </button>
</form>
<app-reference-picker
  #references
  [context]="vm.input().body"
  (picked)="pick($event.path, $event.value, $event.label)"
/>
