@let vm = view();
@if (vm.diagnostics()) {
  <section [attr.aria-label]="'Diagnostics' | localize">
    @if (message()) {
      <p role="status">{{ message() | localize }}</p>
    }
    <app-readiness-panel
      caption="Graph validation"
      note="Graph validation does not check installation, provider or worker readiness."
      [canRecheck]="!vm.busy()"
      [checks]="checks()"
      [stale]="vm.dirty()"
      (recheck)="vm.validate()"
    />
    <ul>
      @for (issue of vm.issues(); track $index) {
        <li>
          @if (issue.node) {
            <button
              pButton
              severity="secondary"
              type="button"
              [outlined]="true"
              (click)="vm.select(issue.node)"
            >
              {{ issue.pointer }} · {{ issue.code }} {{ issue.edge }}
            </button>
          } @else {
            {{ issue.pointer }} · {{ issue.code }}
          }
        </li>
      }
    </ul>
    <a routerLink="/help" [queryParams]="{ topic: 'studio.publish' }">{{
      "Help" | localize
    }}</a>
  </section>
}
