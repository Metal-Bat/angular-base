<div class="flex flex-col gap-2">
  @if (kind() === "connections" && !context()["kind"]) {
    <app-select-control
      [ariaLabel]="'Connection kind' | localize"
      [disabled]="disabled()"
      [ngModel]="connectionKind()"
      (ngModelChange)="connectionKind.set($event)"
    >
      <option value="">{{ "Choose" | localize }}</option>
      <option value="SERVICE">{{ "Service" | localize }}</option>
      <option value="NOTIFICATION">{{ "Notification" | localize }}</option>
    </app-select-control>
  }
  <label [for]="controlId() + '-search'">{{ "Search" | localize }}</label>
  <input
    pInputText
    [disabled]="disabled()"
    [id]="controlId() + '-search'"
    [ngModel]="search()"
    (ngModelChange)="scheduleSearch($event)"
  />
  <button
    pButton
    type="button"
    [disabled]="disabled() || busy()"
    (click)="load()"
  >
    {{ "Find references" | localize }}
  </button>
  <app-select-control
    [ariaLabel]="'Selected resource' | localize"
    [disabled]="disabled() || busy()"
    [inputId]="controlId()"
    [ngModel]="value()"
    (ngModelChange)="choose($event)"
  >
    <option value="">{{ "Choose" | localize }}</option>
    @if (fallback()) {
      <option [value]="value()">
        {{ selected()?.label || ("Selected resource" | localize) }}
      </option>
    }
    @for (row of rows(); track row.key) {
      <option [value]="row.key">{{ row.label }}</option>
    }
  </app-select-control>
  <button
    pButton
    type="button"
    [disabled]="disabled() || !value()"
    (click)="choose('')"
  >
    {{ "Clear" | localize }}
  </button>
  @if (pages() > 1) {
    <div class="flex gap-2">
      <button
        pButton
        type="button"
        [disabled]="disabled() || busy() || page() <= 1"
        (click)="load(page() - 1)"
      >
        {{ "Previous" | localize }}
      </button>
      <button
        pButton
        type="button"
        [disabled]="disabled() || busy() || page() >= pages()"
        (click)="load(page() + 1)"
      >
        {{ "Next" | localize }}
      </button>
    </div>
  }
  @if (error()) {
    <p role="alert">{{ error() | localize }}</p>
  }
</div>
