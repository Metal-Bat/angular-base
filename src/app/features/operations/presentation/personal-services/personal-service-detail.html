@let vm = view();
@if (vm.detail(); as item) {
  <section>
    <h2>{{ item.title }}</h2>
    <p>{{ item.status | localize }}</p>
    <p class="whitespace-pre-wrap">{{ item.content }}</p>
    <button
      pButton
      severity="secondary"
      type="button"
      [outlined]="true"
      (click)="vm.detail.set(null)"
    >
      {{ "Close" | localize }}
    </button>
    @if (vm.notifications) {
      <button
        pButton
        severity="secondary"
        type="button"
        [disabled]="vm.busy() || item.read"
        [outlined]="true"
        (click)="vm.open(item.ref, true)"
      >
        {{ "Mark read" | localize }}
      </button>
      @if (item.target?.available) {
        <button
          pButton
          severity="secondary"
          type="button"
          [disabled]="vm.busy()"
          [outlined]="true"
          (click)="vm.destination()"
        >
          {{ "Open" | localize }}
        </button>
      }
    } @else {
      @if (vm.readyReport()) {
        <button
          pButton
          severity="secondary"
          type="button"
          [disabled]="vm.transfer.busy()"
          [outlined]="true"
          (click)="vm.download()"
        >
          {{ "Download" | localize }}
        </button>
        @if (item.password) {
          <details>
            <summary>{{ "Archive password" | localize }}</summary>
            <bdi>{{ item.password }}</bdi>
          </details>
        }
      }
      <button
        pButton
        severity="secondary"
        type="button"
        [disabled]="vm.busy() || vm.transfer.busy()"
        [outlined]="true"
        (click)="vm.remove()"
      >
        {{ "Delete report" | localize }}
      </button>
      <app-case-history kind="report" [reference]="item.ref" />
    }
  </section>
}
