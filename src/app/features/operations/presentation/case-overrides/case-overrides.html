@if (editor().canEdit() && editor().overrides().length) {
  <fieldset>
    <legend>{{ "Calculation override" | localize }}</legend>
    <label for="override-field">{{ "Field" | localize }}</label
    ><app-select-control
      inputId="override-field"
      [ngModel]="overrideScope()"
      (ngModelChange)="overrideScope.set($event)"
    >
      <option value="">{{ "Choose a value" | localize }}</option>
      @for (node of editor().overrides(); track node.scope) {
        <option [value]="node.scope">{{ node.label ?? node.scope }}</option>
      }
    </app-select-control>
    <label for="override-value">{{ "Value" | localize }}</label
    ><input
      id="override-value"
      [ngModel]="overrideValue()"
      (ngModelChange)="overrideValue.set($event)"
    />
    <label for="override-reason">{{ "Reason" | localize }}</label
    ><input
      id="override-reason"
      maxlength="1024"
      [ngModel]="overrideReason()"
      (ngModelChange)="overrideReason.set($event)"
    />
    <button
      pButton
      severity="secondary"
      type="button"
      [disabled]="
        editor().dirty() || !overrideScope() || !overrideReason().trim()
      "
      [outlined]="true"
      (click)="override('set')"
    >
      {{ "Override value" | localize }}
    </button>
    <button
      pButton
      severity="secondary"
      type="button"
      [disabled]="
        editor().dirty() || !overrideScope() || !overrideReason().trim()
      "
      [outlined]="true"
      (click)="override('reset')"
    >
      {{ "Reset calculation" | localize }}
    </button>
  </fieldset>
}
