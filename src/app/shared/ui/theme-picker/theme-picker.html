<p-select
  appendTo="body"
  class="theme-picker w-full"
  data-theme-picker
  optionLabel="label"
  optionValue="value"
  scrollHeight="20rem"
  [ariaLabel]="'Theme' | localize"
  [checkmark]="true"
  [disabled]="preferences.loading()"
  [group]="true"
  [inputId]="inputId()"
  [ngModel]="scheme.selected()"
  [options]="groups()"
  [pt]="{
    listContainer: {
      tabindex: '0',
      role: 'region',
      'aria-label': locale.text('Theme'),
    },
  }"
  (ngModelChange)="preferences.theme($event)"
>
  <ng-template #selectedItem let-option>
    <span class="inline-flex items-center gap-2">
      <span
        aria-hidden="true"
        class="theme-swatch size-3 shrink-0 rounded-full"
        [style.backgroundColor]="option.color"
      ></span>
      <span>{{ option.label }}</span>
    </span>
  </ng-template>
  <ng-template #group let-group>
    <span class="inline-flex items-center gap-2 text-sm">
      <i aria-hidden="true" [class]="group.icon"></i>
      {{ group.label }}
    </span>
  </ng-template>
  <ng-template #item let-option>
    <span
      class="inline-flex items-center gap-2 text-sm"
      [attr.data-theme-option]="option.value"
    >
      <span
        aria-hidden="true"
        class="size-3 shrink-0 rounded-full"
        [style.backgroundColor]="option.color"
      ></span>
      <span>{{ option.label }}</span>
    </span>
  </ng-template>
</p-select>
