<section class="grid gap-4 max-w-3xl">
  <h1 tabindex="-1">{{ "Form controls" | localize }}</h1>
  <app-field-wrapper
    #nameField
    pointer="/sample/name"
    [errors]="name() ? [] : ['Required' | localize]"
    [label]="'Name' | localize"
  >
    <input
      pInputText
      required
      [attr.aria-describedby]="nameField.describedBy()"
      [attr.aria-invalid]="!name()"
      [id]="nameField.id()"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
    />
  </app-field-wrapper>
  <mat-form-field>
    <mat-label>{{ "Department" | localize }}</mat-label>
    <input
      matInput
      required
      [ngModel]="department()"
      (ngModelChange)="department.set($event)"
    />
    @if (!department()) {
      <mat-error>{{ "Required" | localize }}</mat-error>
    }
  </mat-form-field>
  <div class="flex gap-3 flex-wrap">
    <p-button
      [disabled]="!name() || !department()"
      [label]="'Open preview' | localize"
      (onClick)="preview.set(true)"
    />
    <p-button [label]="'Loading…' | localize" [loading]="true" />
    <button type="button" (click)="confirm()">{{ "Cancel" | localize }}</button>
  </div>
  <p-table [value]="rows">
    <ng-template #caption>{{ "Sample records" | localize }}</ng-template>
    <ng-template #header
      ><tr>
        <th scope="col">{{ "Name" | localize }}</th>
        <th scope="col">{{ "Status" | localize }}</th>
      </tr></ng-template
    >
    <ng-template #body let-row
      ><tr>
        <td>{{ row.name | localize }}</td>
        <td>{{ row.status | localize }}</td>
      </tr></ng-template
    >
  </p-table>
  <p-dialog
    [closeAriaLabel]="'Close' | localize"
    [header]="'Preview' | localize"
    [modal]="true"
    [visible]="preview()"
    (visibleChange)="preview.set($event)"
  >
    <p>
      <bdi>{{ name() }}</bdi> — <bdi>{{ department() }}</bdi>
    </p>
  </p-dialog>
</section>
